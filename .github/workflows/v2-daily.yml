name: v2 Daily Coach Run

on:
  schedule:
    - cron: '0 14 * * *'  # 7 AM PT / 14:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coach:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r v2/requirements.txt

      - name: Run v2 coach
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OURA_TOKEN: ${{ secrets.OURA_TOKEN }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_ACCESS_TOKEN: ${{ secrets.STRAVA_ACCESS_TOKEN }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          MISSION_CONFIG: v2/missions/example.toml
        run: python v2/main.py

      - name: Commit history + output
        uses: EndBug/add-and-commit@v9
        with:
          add: 'v2/memory/ v2/output/'
          author_name: lanterne-rouge-bot
          author_email: bot@users.noreply.github.com
          message: 'chore(v2): daily coach output [skip ci]'
          github_token: ${{ secrets.GH_PAT }}
