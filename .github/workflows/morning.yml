name: Morning Loop

permissions:
  contents: write

on:
  schedule:
    # 8am PT = 15:00 UTC, daily through July (the run on the 27th scores stage 21).
    # Late enough to sync the Oura ring first, still before the day's workout.
    - cron: '0 15 * 7 *'
  workflow_dispatch:
    inputs:
      date:
        description: "Backfill: run as if today were YYYY-MM-DD (rescores the previous day's stage, skips the email)"
        required: false

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      # GH_PAT so the status.json push bypasses main's branch protection
      # and triggers the pages.yml deploy (GITHUB_TOKEN pushes do neither).
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt pynacl

      - name: Run the morning loop
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          OURA_TOKEN: ${{ secrets.OURA_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          DASHBOARD_URL: https://alponsirenas.github.io/lanterne-rouge/
          BACKFILL_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$BACKFILL_DATE" ]; then
            python run_morning.py --date "$BACKFILL_DATE" --no-email
          else
            python run_morning.py
          fi

      - name: Persist rotated Strava token
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python scripts/update_strava_secret.py

      - name: Commit status.json
        run: |
          git config user.name "lanterne-rouge-bot"
          git config user.email "lanterne-rouge-bot@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || git commit -m "coach: morning brief $(date -u +%F)"
          git pull --rebase origin main
          git push
