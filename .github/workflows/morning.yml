name: Morning Loop

permissions:
  contents: write
  pages: write
  id-token: write

on:
  schedule:
    # 6am PT = 13:00 UTC, daily through July (the run on the 27th scores stage 21)
    - cron: '0 13 * 7 *'
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt pynacl

      - name: Run the morning loop
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          OURA_TOKEN: ${{ secrets.OURA_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          DASHBOARD_URL: https://alponsirenas.github.io/lanterne-rouge/
        run: python run_morning.py

      - name: Persist rotated Strava token
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python scripts/update_strava_secret.py

      - name: Commit status.json
        run: |
          git config user.name "lanterne-rouge-bot"
          git config user.email "lanterne-rouge-bot@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || git commit -m "coach: morning brief $(date -u +%F)"
          git push

      # Deploy here directly: pushes made with GITHUB_TOKEN do not trigger pages.yml
      - name: Assemble site
        run: |
          mkdir -p _site/mission
          cp index.html status.json _site/
          cp mission/stages.json _site/mission/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
